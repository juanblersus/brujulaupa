                    </div>
                    <h3 class="text-gray-500 font-bold uppercase tracking-widest text-xs mb-3">Tus respuestas apuntan al área de</h3>
                    <h2 class="text-4xl sm:text-5xl font-black text-gray-900 mb-8">${career.name}</h2>
                    
                    <div class="bg-gray-50 rounded-3xl p-8 sm:p-10 mb-10 text-left border border-gray-100 inline-block max-w-2xl mx-auto shadow-inner">
                        <p class="text-gray-700 text-lg leading-relaxed mb-6">${career.profile}</p>
                        <div class="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm">
                            <p class="text-sm font-bold text-gray-900 mb-3 uppercase tracking-wider"><i class="fas fa-book-open text-upaep-red mr-2"></i>Materias clave:</p>
                            <p class="text-gray-600">${career.subjects.slice(0, 6).join(', ')}...</p>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row justify-center gap-4 max-w-2xl mx-auto">
                        <button onclick="simulateCareer('${highestCategory}')" class="flex-1 bg-gray-900 text-white font-bold py-4 px-6 rounded-xl hover:bg-gray-800 transition shadow-lg hover:-translate-y-1 transform flex items-center justify-center gap-3">
                            <i class="fas fa-balance-scale text-lg"></i> Comparar en Simulador
                        </button>
                        <button onclick="showToast('Cita de orientación agendada correctamente.')" class="flex-1 bg-white border-2 border-upaep-red text-upaep-red font-bold py-4 px-6 rounded-xl hover:bg-red-50 transition shadow-sm hover:-translate-y-1 transform flex items-center justify-center gap-3">
                            <i class="fas fa-user-md text-lg"></i> Cita Psicopedagógica
                        </button>
                    </div>
                    
                    <div class="mt-12 pt-6 border-t border-gray-100">
                        <button onclick="startVocationalTest()" class="text-gray-400 hover:text-gray-700 font-semibold text-sm transition flex items-center justify-center gap-2 mx-auto">
                            <i class="fas fa-redo"></i> Repetir Test Vocacional
                        </button>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // LÓGICA DEL SIMULADOR
        // ==========================================
        
        // Helper function for navigating and triggering the simulation from test results
        function simulateCareer(category) {
            navigate('simulator');
            setTimeout(() => {
                const targetSelect = document.getElementById('sim-target');
                if (targetSelect) {
                    targetSelect.value = category;
                    runSimulation();
                }
            }, 100);
        }

        function runSimulation() {
            const sourceKey = document.getElementById('sim-source').value;
            const targetKey = document.getElementById('sim-target').value;
            const resultsContainer = document.getElementById('sim-results');
            
            if (sourceKey === targetKey) {
                showToast("Por favor selecciona una carrera destino diferente a la actual.");
                return;
            }

            const source = careersDB[sourceKey];
            const target = careersDB[targetKey];
            
            resultsContainer.classList.remove('hidden');
            // Trigger reflow
            void resultsContainer.offsetWidth;
            resultsContainer.classList.remove('opacity-0', 'translate-y-4');

            // Simulación de materias (lógica visual)
            const commonSubjects = source.subjects.filter(s => target.subjects.includes(s));
            // Agregar materias genéricas de tronco común para simulación
            commonSubjects.push('Formación Humanista', 'Inglés', 'Habilidades Universitarias');
            
            const newSubjects = target.subjects.filter(s => !source.subjects.includes(s));

            // Simular porcentaje de avance salvado (aleatorio realista)
            const savedPercentage = Math.floor(Math.random() * (45 - 20 + 1) + 20);

            resultsContainer.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <!-- Comparativa Perfiles -->
                    <div class="bg-gray-900 rounded-[2.5rem] p-8 sm:p-10 text-white shadow-xl relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-upaep-red rounded-full blur-3xl opacity-20 -translate-y-1/2 translate-x-1/2"></div>
                        <h3 class="text-xl font-bold mb-8 flex items-center gap-3"><i class="fas fa-exchange-alt text-upaep-red"></i> Comparativa de Perfiles</h3>
                        
                        <div class="mb-8">
                            <span class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-2 block">Dejas de enfocarte en:</span>
                            <h4 class="text-lg font-bold text-gray-200 mb-2">${source.name}</h4>
                            <p class="text-sm text-gray-400 leading-relaxed">${source.profile}</p>
                        </div>
                        
                        <div class="relative pl-6 border-l-2 border-upaep-red">
                            <span class="text-upaep-red text-xs font-bold uppercase tracking-wider mb-2 block">Para enfocarte en:</span>
                            <h4 class="text-xl font-bold text-white mb-2">${target.name}</h4>
                            <p class="text-sm text-gray-300 leading-relaxed">${target.profile}</p>
                        </div>
                    </div>

                    <!-- Revalidación Estimada -->
                    <div class="bg-white rounded-[2.5rem] p-8 sm:p-10 border border-gray-100 shadow-sm flex flex-col justify-center">
                        <h3 class="text-xl font-bold text-gray-900 mb-2">Simulación de Revalidación</h3>
                        <p class="text-sm text-gray-500 mb-8 leading-relaxed">Estimación basada en el tronco común interdepartamental. Los resultados reales pueden variar.</p>
                        
                        <div class="mb-4 flex justify-between items-end">
                            <span class="text-sm font-bold text-gray-400 uppercase tracking-wider">Créditos conservados</span>
                            <span class="text-3xl font-black text-green-500">${savedPercentage}%</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-4 mb-8 overflow-hidden shadow-inner">
                            <div class="bg-green-500 h-full rounded-full progress-bar-anim" style="width: 0%;" data-target="${savedPercentage}%"></div>
                        </div>

                        <div class="grid grid-cols-2 gap-6">
                            <div>
                                <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4 border-b border-gray-100 pb-2"><i class="fas fa-check text-green-500 mr-2"></i>Materias que salvas</h4>
                                <ul class="text-sm text-gray-600 space-y-3">
                                    ${commonSubjects.map(s => `<li>• ${s}</li>`).join('')}
                                </ul>
                            </div>
                            <div>
                                <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4 border-b border-gray-100 pb-2"><i class="fas fa-star text-upaep-red mr-2"></i>Nuevas materias</h4>
                                <ul class="text-sm text-gray-600 space-y-3">
                                    ${newSubjects.slice(0,4).map(s => `<li>• ${s}</li>`).join('')}
                                    <li class="text-gray-400 italic">Y otras más...</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Animar la barra después de inyectar
            setTimeout(() => {
                const bar = resultsContainer.querySelector('.progress-bar-anim');
                if (bar) {
                    bar.style.transition = 'width 1.5s cubic-bezier(0.22, 1, 0.36, 1)';
                    bar.style.width = bar.getAttribute('data-target');
                }
            }, 100);
        }

        // ==========================================
        // LÓGICA DE MENSAJES (CHAT)
        // ==========================================
        function sendChatMessage(event) {
            event.preventDefault();
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            const chatHistory = document.getElementById('chat-history');
            
            // Render user message
            chatHistory.innerHTML += `
                <div class="flex items-end justify-end gap-2 fade-in">
                    <div class="bg-upaep-red text-white p-4 rounded-2xl rounded-br-none max-w-[80%] shadow-sm">
                        <p class="text-sm">${message}</p>
                    </div>
                </div>
            `;
            
            input.value = '';
            chatHistory.scrollTop = chatHistory.scrollHeight;

            // Simulate typing indicator
            const typingId = 'typing-' + Date.now();
            setTimeout(() => {
                chatHistory.innerHTML += `
                    <div id="${typingId}" class="flex items-end gap-2 fade-in">
                        <img src="https://placehold.co/100x100/c7d2fe/4f46e5?text=D" class="w-8 h-8 rounded-full">
                        <div class="bg-gray-100 text-gray-800 p-4 rounded-2xl rounded-bl-none shadow-sm flex items-center gap-1">
                            <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"></div>
                            <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                            <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                        </div>
                    </div>
                `;
                chatHistory.scrollTop = chatHistory.scrollHeight;

                // Simulate reply
                setTimeout(() => {
                    const typingIndicator = document.getElementById(typingId);
                    if (typingIndicator) typingIndicator.remove();
                    
                    chatHistory.innerHTML += `
                        <div class="flex items-end gap-2 fade-in">
                            <img src="https://placehold.co/100x100/c7d2fe/4f46e5?text=D" class="w-8 h-8 rounded-full">
                            <div class="bg-gray-100 text-gray-800 p-4 rounded-2xl rounded-bl-none max-w-[80%] shadow-sm">
                                <p class="text-sm">Entiendo. Toma tu tiempo para pensarlo. Si decides explorar más a fondo Arquitectura o cualquier duda de materias, aquí estoy para apoyarte.</p>
                            </div>
                        </div>
                    `;
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                }, 1500);

            }, 500);
        }

        // ==========================================
        // FUNCIONES GENERALES Y UI
        // ==========================================
        function navigate(viewName) {
            const content = document.getElementById('app-content');
            content.innerHTML = views[viewName];
            
            // Actualizar estado activo en navegación Desktop
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-upaep-red', 'bg-gray-100', 'bg-blue-50', 'text-blue-600');
                if (btn.innerText.toLowerCase().includes(viewName) || (viewName === 'simulator' && btn.innerText.includes('Simulador'))) {
                    if (viewName === 'simulator') {
                        btn.classList.add('text-blue-600', 'bg-blue-50');
                    } else {
                        btn.classList.add('text-upaep-red', 'bg-gray-100');
                    }
                }
            });

            // Actualizar estado activo en navegación Móvil
            document.querySelectorAll('.mobile-nav-btn').forEach(btn => {
                const target = btn.getAttribute('data-target');
                
                // Reset styles
                if(target === 'simulator') {
                    const iconBg = btn.querySelector('.simulator-icon-bg');
                    const text = btn.querySelector('.simulator-text');
                    iconBg.classList.remove('bg-blue-600');
                    iconBg.classList.add('bg-gray-900');
                    text.classList.remove('text-blue-600');
                    text.classList.add('text-gray-500');
                } else {
                    btn.classList.remove('text-upaep-red');
                    btn.classList.add('text-gray-500');
                }

                // Apply active styles
                if (target === viewName) {
                    if (viewName === 'simulator') {
                        const iconBg = btn.querySelector('.simulator-icon-bg');
                        const text = btn.querySelector('.simulator-text');
                        iconBg.classList.remove('bg-gray-900');
                        iconBg.classList.add('bg-blue-600');
                        text.classList.remove('text-gray-500');
                        text.classList.add('text-blue-600');
                    } else {
                        btn.classList.remove('text-gray-500');
                        btn.classList.add('text-upaep-red');
                    }
                }
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Modales y Notificaciones
        function openArticle(id) {
            const article = articlesDB.find(a => a.id === id);
            if (!article) return;
            
            document.getElementById('article-body').innerHTML = article.content;
            const modal = document.getElementById('article-modal');
            const container = document.getElementById('article-container');
            
            modal.classList.remove('hidden');
            void modal.offsetWidth; // Reflow
            modal.classList.remove('opacity-0');
            container.classList.remove('translate-y-full', 'sm:translate-y-8');
        }

        function closeArticle() {
            const modal = document.getElementById('article-modal');
            const container = document.getElementById('article-container');
            
            modal.classList.add('opacity-0');
            container.classList.add('translate-y-full', 'sm:translate-y-8');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function openVideo(title) {
            document.getElementById('video-title').innerText = title;
            const modal = document.getElementById('video-modal');
            modal.classList.remove('hidden');
            void modal.offsetWidth; // Reflow
            modal.classList.remove('opacity-0');
        }

        function closeVideo() {
            const modal = document.getElementById('video-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-gray-900 text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 transform translate-y-10 opacity-0 transition-all duration-300 font-medium text-sm';
            toast.innerHTML = `<i class="fas fa-info-circle text-upaep-red text-lg"></i> ${message}`;
            
            container.appendChild(toast);
            
            // Animar entrada
            setTimeout(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            }, 10);
            
            // Animar salida y remover
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Inicializar la app
        document.addEventListener('DOMContentLoaded', () => {
            navigate('home');
        });
    </script>
</body>
</html>
